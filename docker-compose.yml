services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emcoin
      POSTGRES_USER: emcoin
      POSTGRES_PASSWORD: emcoin_dev_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U emcoin -d emcoin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://emcoin:emcoin_dev_change_me@db:5432/emcoin
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
