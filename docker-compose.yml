services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emcoin
      POSTGRES_USER: emcoin
      POSTGRES_PASSWORD: emcoin
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  postgres_data:
